name: OWASP ZAP Authenticated POC Scan

on:
  workflow_dispatch:

jobs:

  zap-security-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Start Juice Shop
      # -----------------------------

      - name: Start Juice Shop
        run: |

          docker pull bkimminich/juice-shop

          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop


          echo "Waiting for Juice Shop..."

          sleep 30


          curl -I http://localhost:3000



      # -----------------------------
      # Setup Node
      # -----------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20



      # -----------------------------
      # Install Playwright
      # -----------------------------

      - name: Install Playwright
        run: |

          npm init -y

          npm install playwright

          npx playwright install chromium



      # -----------------------------
      # Login Application
      # -----------------------------

      - name: Authenticate with Playwright
        env:

          APP_USERNAME: ${{ secrets.APP_USERNAME }}

          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

        run: |

          node playwright/login.js



      # Verify authentication file

      - name: Verify Playwright Session
        run: |

          ls -la

          test -f auth.json



      # -----------------------------
      # Start OWASP ZAP
      # -----------------------------

      - name: Start OWASP ZAP
        run: |

          docker pull ghcr.io/zaproxy/zaproxy:stable


          docker run -d \
            --name zap \
            --network host \
            -v ${{ github.workspace }}:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh \
            -daemon \
            -host 0.0.0.0 \
            -port 8080 \
            -config api.disablekey=true



          echo "Waiting for ZAP..."

          sleep 30



      # -----------------------------
      # Run ZAP Scan
      # -----------------------------

      - name: Run ZAP Full Scan
        run: |

          docker exec zap \
          zap-full-scan.py \
          -t http://localhost:3000 \
          -r /zap/wrk/zap-report.html \
          -I



      # -----------------------------
      # Upload Report
      # -----------------------------

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4

        with:

          name: zap-authenticated-report

          path: zap-report.html
