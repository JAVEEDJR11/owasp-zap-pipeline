name: OWASP ZAP Authenticated Scan

on:
  workflow_dispatch:

jobs:
  zap-authenticated-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################
      # Start Juice Shop
      ##########################################################

      - name: Start Juice Shop
        run: |

          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop

          echo "Waiting for Juice Shop..."

          until curl -s http://localhost:3000 > /dev/null
          do
            sleep 5
          done

          echo "Juice Shop Started"


      ##########################################################
      # Register Test User
      ##########################################################

      - name: Register Test User
        run: |
          echo "Registering test user..."

          RESPONSE=$(curl -s -X POST http://localhost:3000/api/Users/ \
            -H "Content-Type: application/json" \
            -d '{
              "email":"test@example.com",
              "password":"test@12345",
              "passwordRepeat":"test@12345",
              "securityQuestion":{
                "id":1,
                "answer":"test"
              }
            }')

          echo "$RESPONSE"
          echo "Registration completed."
      ##########################################################
      # Start ZAP
      ##########################################################

      - name: Start ZAP Daemon
        run: |

          docker run -d \
            --name zap \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh \
            -daemon \
            -host 0.0.0.0 \
            -port 8080 \
            -config api.disablekey=true

      ##########################################################
      # Wait for ZAP
      ##########################################################

      - name: Wait for ZAP
        run: |

          echo "Waiting for ZAP..."

          for i in {1..60}
          do
            if curl -s http://localhost:8080 >/dev/null
            then
              echo "ZAP Ready"
              exit 0
            fi

            sleep 5
          done

          echo "ZAP failed to start"
          docker logs zap

          exit 1

      ##########################################################
      # Install Node
      ##########################################################

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      ##########################################################
      # Install Playwright
      ##########################################################

      - name: Install Dependencies

        run: |

          npm init -y

          npm install playwright

          npx playwright install chromium

      ##########################################################
      # Login
      ##########################################################

      - name: Login using Playwright

        env:

          APP_USERNAME: ${{ secrets.APP_USERNAME }}

          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

        run: |

          node playwright/login.js

      ##########################################################
      # Spider
      ##########################################################

      - name: Start Spider

        run: |

          curl "http://localhost:8080/JSON/spider/action/scan/?url=http://localhost:3000"

      ##########################################################
      # Wait Spider
      ##########################################################

      - name: Wait Spider

        run: |

          while true
          do

            STATUS=$(curl -s \
            "http://localhost:8080/JSON/spider/view/status/" \
            | jq -r '.status')

            echo "Spider : $STATUS %"

            if [ "$STATUS" = "100" ]
            then
              break
            fi

            sleep 5

          done

      ##########################################################
      # Active Scan
      ##########################################################

      - name: Start Active Scan

        run: |

          curl "http://localhost:8080/JSON/ascan/action/scan/?url=http://localhost:3000"

      ##########################################################
      # Wait Active Scan
      ##########################################################

      - name: Wait Active Scan

        run: |

          while true
          do

            STATUS=$(curl -s \
            "http://localhost:8080/JSON/ascan/view/status/" \
            | jq -r '.status')

            echo "Active Scan : $STATUS %"

            if [ "$STATUS" = "100" ]
            then
              break
            fi

            sleep 10

          done

      ##########################################################
      # Generate Report
      ##########################################################

      - name: Download HTML Report

        run: |

          curl \
          http://localhost:8080/OTHER/core/other/htmlreport/ \
          -o zap-auth-report.html

      ##########################################################
      # Upload
      ##########################################################

      - name: Upload Report

        uses: actions/upload-artifact@v4

        with:

          name: zap-report

          path: zap-auth-report.html

      ##########################################################
      # Upload Authentication Screenshot
      ##########################################################

      - name: Upload Authentication Screenshot

        uses: actions/upload-artifact@v4

        if: always()

        with:

          name: authentication-proof

          path: authentication-proof.png

      ##########################################################
      # Upload Basket Screenshot
      ##########################################################

      - name: Upload Basket Screenshot

        uses: actions/upload-artifact@v4

        if: always()

        with:

          name: basket-proof

          path: basket-page.png           

      ##########################################################
      # ZAP Logs (always)
      ##########################################################

      - name: ZAP Logs

        if: always()

        run: |

          docker logs zap
