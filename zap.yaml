env:
  contexts:
    - name: JuiceShop
      urls:
        - http://localhost:3000
      includePaths:
        - http://localhost:3000.*

jobs:

  - type: spider
    parameters:
      context: JuiceShop

  - type: passiveScan-wait

  - type: activeScan
    parameters:
      context: JuiceShop

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-auth-report.html
